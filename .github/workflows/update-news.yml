name: Collect and deploy news

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sources.json"
      - "scripts/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-dashboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3" "feedparser>=6.0,<7"

      - name: Collect news
        run: python scripts/collect_news.py

      - name: Save news.json to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update collected news"
            git push
          fi

      - name: Prepare website files
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp news.json dist/news.json
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: collect
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
