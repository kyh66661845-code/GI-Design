name: Collect and deploy semiconductor news

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sources.json"
      - "requirements.txt"
      - "scripts/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: semiconductor-news-dashboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Collect semiconductor news
        run: python scripts/collect_news.py

      - name: Translate and summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/enrich_news.py

      - name: Save news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update semiconductor news and Korean summaries"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp news.json dist/news.json
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: collect
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
